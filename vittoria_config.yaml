# Vittoria 808 Autonomous M2M Agent Configuration
agent_integration:
  framework_compatibility:
    - eliza-os
    - autonolas
  api_gateway: "https://vittoria808.io"
  encryption_standard: "AES-256-GCM"

licensing_parameters:
  base_cost_sol: 4.0
  validity_period_days: 90
  token_gating: true

runtime_behavior:
  on_deadlock_detected: "HALT_AND_FETCH_SOP"
  context_flushing: true # Immediately flushes high-density data post-execution to reduce compute costs
  max_context_bloat_limit_kb: 128
